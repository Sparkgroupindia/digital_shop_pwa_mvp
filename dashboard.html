<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">

<title>Digital Shop Dashboard</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,system-ui,sans-serif;
 background:#f5f7fb;
 color:#111827;
}

.top{
 background:#111827;
 color:white;
 padding:15px;
 position:sticky;
 top:0;
 z-index:10;
}

.top-inner{
 max-width:1100px;
 margin:auto;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:15px;
}

.brand{
 font-size:20px;
 font-weight:700;
}

.logout{
 background:#374151;
 color:white;
 border:0;
 padding:9px 14px;
 border-radius:8px;
 cursor:pointer;
}

.container{
 max-width:1100px;
 margin:auto;
 padding:18px;
}

.shop-card{
 background:white;
 border-radius:16px;
 padding:20px;
 box-shadow:0 4px 20px rgba(0,0,0,.06);
 margin-bottom:18px;
}

.shop-head{
 display:flex;
 align-items:center;
 gap:15px;
}

.logo{
 width:70px;
 height:70px;
 object-fit:contain;
 border-radius:14px;
 border:1px solid #ddd;
 background:#fff;
}

h2,h3{
 margin-top:0;
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:15px;
}

.stat{
 background:white;
 border-radius:14px;
 padding:18px;
 box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.stat b{
 display:block;
 font-size:28px;
 margin-top:5px;
}

.btn{
 border:0;
 background:#111827;
 color:white;
 padding:11px 16px;
 border-radius:9px;
 cursor:pointer;
}

.btn.secondary{
 background:#e5e7eb;
 color:#111827;
}

.btn.success{
 background:#059669;
}

.btn.danger{
 background:#dc2626;
}

.form-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
}

input,textarea,select{
 width:100%;
 padding:11px;
 border:1px solid #d1d5db;
 border-radius:8px;
 font:inherit;
}

textarea{
 min-height:90px;
 resize:vertical;
}

label{
 font-size:13px;
 font-weight:600;
 display:block;
 margin-bottom:5px;
}

.product{
 background:white;
 border-radius:14px;
 padding:12px;
 box-shadow:0 3px 15px rgba(0,0,0,.05);
 overflow:hidden;
}

.product-img{
 width:100%;
 aspect-ratio:1/1;
 object-fit:cover;
 border-radius:10px;
 background:#f3f4f6;
 display:block;
 margin-bottom:12px;
}

.product-info{
 line-height:1.6;
}

.product-name{
 font-size:17px;
 font-weight:700;
}

.product-actions{
 display:flex;
 gap:7px;
 margin-top:12px;
}

.product-actions button{
 flex:1;
}

.shop-actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-top:12px;
}

.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.6);
 display:none;
 align-items:center;
 justify-content:center;
 padding:15px;
 z-index:100;
}

.modal.show{
 display:flex;
}

.modal-box{
 width:100%;
 max-width:600px;
 max-height:90vh;
 overflow:auto;
 background:white;
 border-radius:18px;
 padding:20px;
}

.close{
 float:right;
 border:0;
 background:#eee;
 border-radius:50%;
 width:35px;
 height:35px;
 cursor:pointer;
 font-size:20px;
}

.notice{
 padding:12px;
 border-radius:9px;
 background:#ecfdf5;
 color:#065f46;
 margin-bottom:15px;
 display:none;
}

.shop-link{
 background:#f3f4f6;
 padding:12px;
 border-radius:9px;
 word-break:break-all;
 margin:10px 0;
}

.image-preview{
 width:140px;
 height:140px;
 object-fit:cover;
 border-radius:12px;
 border:1px solid #ddd;
 display:none;
 margin-top:10px;
}

@media(max-width:650px){

 .grid,
 .form-grid{
   grid-template-columns:1fr;
 }

 .container{
   padding:12px;
 }

 .shop-head{
   align-items:flex-start;
 }

 .product-actions{
   flex-direction:column;
 }

 .product-actions button{
   width:100%;
 }

 .shop-actions .btn{
   flex:1;
 }
}
</style>
</head>

<body>

<header class="top">

 <div class="top-inner">

   <div class="brand">
     Digital Shop Dashboard
   </div>

   <button
     class="logout"
     onclick="logout()">
     Logout
   </button>

 </div>

</header>


<div class="container">

 <div
   id="loading"
   class="shop-card">

   Loading dashboard...

 </div>


 <div
   id="dashboard"
   style="display:none">


   <!-- BUSINESS -->

   <div class="shop-card">

     <div class="shop-head">

       <img
         id="logo"
         class="logo"
         src=""
         alt="Logo">

       <div>

         <h2 id="businessName"></h2>

         <div id="owner"></div>

         <div id="address"></div>

       </div>

     </div>


     <div class="shop-link">

       <b>Your Shop</b>

       <br>

       <span id="shopLink"></span>

     </div>


     <div class="shop-actions">

       <button
         class="btn"
         onclick="openProfile()">
         Edit Profile
       </button>

       <button
         class="btn success"
         onclick="openShop()">
         Open Shop
       </button>

       <button
         class="btn secondary"
         onclick="copyShopLink()">
         Copy Link
       </button>

     </div>

   </div>


   <!-- STATS -->

   <div class="grid">

     <div class="stat">
       Products
       <b id="productCount">0</b>
     </div>

     <div class="stat">
       Categories
       <b id="categoryCount">0</b>
     </div>

     <div class="stat">
       Plan
       <b id="planName">-</b>
     </div>

     <div class="stat">
       Theme
       <b id="themeName">-</b>
     </div>

   </div>


   <br>


   <!-- PRODUCTS -->

   <div class="shop-card">

     <h3>
       Products
     </h3>

     <button
       class="btn"
       onclick="openProduct()">
       + Add Product
     </button>

     <br><br>

     <div
       id="products"
       class="grid">
     </div>

   </div>

 </div>


 <div
   id="notice"
   class="notice">
 </div>

</div>



<!-- PROFILE MODAL -->

<div
 id="profileModal"
 class="modal">

 <div class="modal-box">

   <button
     class="close"
     onclick="closeProfile()">
     ×
   </button>

   <h2>
     Business Profile
   </h2>

   <div class="form-grid">

     <div>
       <label>Business Name</label>
       <input id="pBusiness">
     </div>

     <div>
       <label>Owner Name</label>
       <input id="pOwner">
     </div>

     <div>
       <label>Mobile</label>
       <input id="pMobile">
     </div>

     <div>
       <label>WhatsApp</label>
       <input id="pWhatsApp">
     </div>

     <div>
       <label>Email</label>
       <input id="pEmail">
     </div>

     <div>
       <label>Address</label>
       <input id="pAddress">
     </div>

     <div>
       <label>Map Link</label>
       <input id="pMap">
     </div>

    <div>
  <label>Business Logo</label>

  <input
    id="pLogo"
    type="file"
    accept="image/*"
    capture="environment">

  <div
    id="logoStatus"
    style="font-size:13px;margin-top:6px;color:#666">
  </div>

  <img
    id="logoPreview"
    style="
      width:80px;
      height:80px;
      object-fit:contain;
      border:1px solid #ddd;
      border-radius:12px;
      margin-top:8px;
      display:none;">
</div>

     <div>

       <label>
         Theme
       </label>

       <select id="pTheme">

         <option value="T01">
           Luxury Black
         </option>

         <option value="T02">
           Silver Premium
         </option>

         <option value="T03">
           Royal Blue
         </option>

         <option value="T04">
           Minimal White
         </option>

         <option value="T05">
           Dark Gold
         </option>

         <option value="T06">
           Modern
         </option>

       </select>

     </div>

   </div>

   <br>

   <button
     class="btn"
     onclick="saveProfile()">
     Save Profile
   </button>

 </div>

</div>



<!-- PRODUCT MODAL -->

<div
 id="productModal"
 class="modal">

 <div class="modal-box">

   <button
     class="close"
     onclick="closeProduct()">
     ×
   </button>


   <h2 id="productTitle">
     Add Product
   </h2>


   <input
     type="hidden"
     id="productId">


   <label>
     Product Name
   </label>

   <input
     id="productName">

   <br>


   <label>
     Category
   </label>

   <select id="productCategory">

     <option value="">
       Select Category
     </option>

   </select>

   <br>


   <label>
     Product Code
   </label>

   <input
     id="productCode">

   <br>


   <label>
     Price
   </label>

   <input
     id="productPrice"
     type="number">

   <br>


   <label>
     Product Image
   </label>

   <input
     id="productImage"
     type="file"
     accept="image/*"
     capture="environment">


   <img
     id="imagePreview"
     class="image-preview"
     alt="Preview">


   <div
     id="imageStatus"
     style="font-size:13px;margin-top:6px;color:#666">
   </div>

   <br>


   <label>
     Description
   </label>

   <textarea
     id="productDescription">
   </textarea>

   <br>


   <button
     class="btn"
     onclick="saveProduct()">

     Save Product

   </button>

 </div>

</div>



<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwbU3NlHVOUCTpSYQoyO-WsqMkd3RyPFKeq1YPh1zlKF3BI_7UlDeIpYuK4TxE15B0uTQ/exec";


let dashboardData = null;


function getUserId(){

 const params =
 new URLSearchParams(
   location.search
 );

 return params.get("userId") || "U001";
}


function esc(value=""){

 return String(value)
   .replace(/[&<>"']/g,m=>({
     "&":"&amp;",
     "<":"&lt;",
     ">":"&gt;",
     '"':"&quot;",
     "'":"&#039;"
   }[m]));

}



async function loadDashboard(){

 const userId =
 getUserId();

 try{

   const response =
   await fetch(
     API_URL +
     "?action=dashboard&userId=" +
     encodeURIComponent(userId)
   );

   const result =
   await response.json();

   if(!result.ok){

     document.getElementById("loading")
       .innerHTML =
       "<h3>Dashboard Error</h3><p>"+
       esc(result.error)+
       "</p>";

     return;
   }

   dashboardData =
   result;

   renderDashboard();

 }catch(error){

   document.getElementById("loading")
     .innerHTML =
     "<h3>Connection Error</h3>"+
     "<p>Internet connection check karein.</p>";

   console.error(error);

 }

}



function renderDashboard(){

 const user =
 dashboardData.user;


 document.getElementById("loading")
   .style.display="none";


 document.getElementById("dashboard")
   .style.display="block";


 document.getElementById("businessName")
   .textContent =
   user.Business_Name || "";


 document.getElementById("owner")
   .textContent =
   user.Owner_Name || "";


 document.getElementById("address")
   .textContent =
   user.Address || "";


 document.getElementById("productCount")
   .textContent =
   dashboardData.products.length;


 document.getElementById("categoryCount")
   .textContent =
   dashboardData.categories.length;


 document.getElementById("planName")
   .textContent =
   user.Plan_ID || "-";


 const themeNames={

   T01:"Luxury Black",
   T02:"Silver Premium",
   T03:"Royal Blue",
   T04:"Minimal White",
   T05:"Dark Gold",
   T06:"Modern"

 };


 document.getElementById("themeName")
   .textContent =
   themeNames[user.Theme_ID] || "-";


 const shopUrl =
 location.origin +
 location.pathname.replace(
   "dashboard.html",
   "index.html"
 ) +
 "?slug=" +
 encodeURIComponent(
   user.Slug
 );


 document.getElementById("shopLink")
   .textContent =
   shopUrl;


 window.currentShopUrl =
   shopUrl;


 document.getElementById("logo").src =
   user.Logo ||
   "data:image/svg+xml,"+
   encodeURIComponent(`
     <svg xmlns="http://www.w3.org/2000/svg"
          width="200"
          height="200">

       <rect
         width="100%"
         height="100%"
         fill="#eeeeee"/>

       <text
         x="50%"
         y="50%"
         text-anchor="middle"
         dominant-baseline="middle"
         font-size="30">

         LOGO

       </text>

     </svg>
   `);


 renderProducts();

}



function renderProducts(){

 const box =
 document.getElementById("products");


 if(!dashboardData.products.length){

   box.innerHTML =
   "<p>No products yet.</p>";

   return;
 }


 box.innerHTML =
 dashboardData.products.map(
   product => {

     const image =
       product.Images ||
       "data:image/svg+xml,"+
       encodeURIComponent(`
         <svg xmlns="http://www.w3.org/2000/svg"
              width="500"
              height="500">

           <rect
             width="100%"
             height="100%"
             fill="#eeeeee"/>

           <text
             x="50%"
             y="50%"
             text-anchor="middle"
             dominant-baseline="middle"
             font-size="25">

             No Image

           </text>

         </svg>
       `);


     return `

       <div class="product">

         <img
           class="product-img"
           src="${esc(image)}"
           alt="${esc(product.Name)}"
           onerror="this.style.display='none'">


         <div class="product-info">

           <div class="product-name">
             ${esc(product.Name)}
           </div>

           <div>
             Category:
             ${esc(product.Category)}
           </div>

           <div>
             Code:
             ${esc(product.Code)}
           </div>

           <div>
             Price:
             ₹${esc(product.Price)}
           </div>

         </div>


         <div class="product-actions">

           <button
             class="btn secondary"
             onclick="editProduct('${esc(product.Product_ID)}')">

             Edit

           </button>


           <button
             class="btn danger"
             onclick="deleteProduct('${esc(product.Product_ID)}')">

             Delete

           </button>

         </div>

       </div>

     `;

   }
 ).join("");

}



function fillCategories(){

 const select =
 document.getElementById(
   "productCategory"
 );


 const categories =
 dashboardData.categories || [];


 select.innerHTML =
 `<option value="">
    Select Category
  </option>`;


 categories.forEach(category => {

   const option =
   document.createElement("option");

   option.value =
     category.Name;

   option.textContent =
     category.Name;

   select.appendChild(option);

 });

}



function openProfile(){

  const u =
    dashboardData.user;

  document.getElementById("pBusiness").value =
    u.Business_Name || "";

  document.getElementById("pOwner").value =
    u.Owner_Name || "";

  document.getElementById("pMobile").value =
    u.Mobile || "";

  document.getElementById("pWhatsApp").value =
    u.WhatsApp || "";

  document.getElementById("pEmail").value =
    u.Email || "";

  document.getElementById("pAddress").value =
    u.Address || "";

  document.getElementById("pMap").value =
    u.Map_Link || "";

  document.getElementById("pTheme").value =
    u.Theme_ID || "T01";

  document.getElementById("pLogo").value = "";

  document.getElementById("logoStatus").textContent = "";

  const preview =
    document.getElementById("logoPreview");

  if (u.Logo) {
    preview.src = u.Logo;
    preview.style.display = "block";
  } else {
    preview.style.display = "none";
  }

  document.getElementById("profileModal")
    .classList.add("show");
}



function closeProfile(){

 document.getElementById("profileModal")
   .classList.remove("show");

}



async function saveProfile(){

  const user =
    dashboardData.user;

  const payload = {

    action: "saveProfile",

    User_ID: user.User_ID,

    Business_Name:
      document.getElementById("pBusiness").value,

    Owner_Name:
      document.getElementById("pOwner").value,

    Mobile:
      document.getElementById("pMobile").value,

    WhatsApp:
      document.getElementById("pWhatsApp").value,

    Email:
      document.getElementById("pEmail").value,

    Address:
      document.getElementById("pAddress").value,

    Map_Link:
      document.getElementById("pMap").value,

    Theme_ID:
      document.getElementById("pTheme").value
  };

  const result =
    await postData(payload);

  if (!result.ok) {
    alert(result.error || "Profile save failed");
    return;
  }

  const logoInput =
    document.getElementById("pLogo");

  if (
    logoInput.files &&
    logoInput.files.length
  ) {

    document.getElementById("logoStatus")
      .textContent =
      "Logo processing...";

    try {

      const base64 =
        await compressImage(
          logoInput.files[0]
        );

      document.getElementById("logoStatus")
        .textContent =
        "Logo uploading...";

      const logoResult =
        await postData({

          action: "saveLogo",

          User_ID:
            user.User_ID,

          base64:
            base64
        });

      if (!logoResult.ok) {

        alert(
          logoResult.error ||
          "Logo upload failed"
        );

        return;
      }

      document.getElementById("logoStatus")
        .textContent =
        "Logo saved successfully.";

    } catch(error) {

      console.error(error);

      alert("Logo upload failed.");
      return;
    }
  }

  closeProfile();

  await loadDashboard();

  showNotice(
    "Profile saved successfully."
  );
}



function openProduct(){

 document.getElementById("productId").value="";
 document.getElementById("productName").value="";
 document.getElementById("productCategory").value="";
 document.getElementById("productCode").value="";
 document.getElementById("productPrice").value="";
 document.getElementById("productDescription").value="";
 document.getElementById("productImage").value="";
 document.getElementById("imageStatus").textContent="";


 document.getElementById("imagePreview").style.display="none";


 fillCategories();


 document.getElementById("productTitle")
   .textContent =
   "Add Product";


 document.getElementById("productModal")
   .classList.add("show");

}



function closeProduct(){

 document.getElementById("productModal")
   .classList.remove("show");

}



function editProduct(id){

 const product =
 dashboardData.products.find(
   p =>
   String(p.Product_ID) ===
   String(id)
 );


 if(!product)return;


 document.getElementById("productId").value =
   product.Product_ID;


 document.getElementById("productName").value =
   product.Name || "";


 fillCategories();


 document.getElementById("productCategory").value =
   product.Category || "";


 document.getElementById("productCode").value =
   product.Code || "";


 document.getElementById("productPrice").value =
   product.Price || "";


 document.getElementById("productDescription").value =
   product.Description || "";


 document.getElementById("productImage").value="";


 document.getElementById("imageStatus").textContent="";


 if(product.Images){

   document.getElementById("imagePreview").src =
     product.Images;

   document.getElementById("imagePreview").style.display =
     "block";

 }else{

   document.getElementById("imagePreview").style.display =
     "none";

 }


 document.getElementById("productTitle")
   .textContent =
   "Edit Product";


 document.getElementById("productModal")
   .classList.add("show");

}



document.getElementById(
 "productImage"
).addEventListener(
 "change",
 function(){

   const file =
     this.files &&
     this.files[0];

   const preview =
     document.getElementById(
       "imagePreview"
     );


   if(!file){

     preview.style.display="none";
     return;

   }


   const reader =
     new FileReader();


   reader.onload =
     function(e){

       preview.src =
         e.target.result;

       preview.style.display =
         "block";

     };


   reader.readAsDataURL(file);

 });



async function saveProduct(){

 const user =
   dashboardData.user;


 const productId =
   document.getElementById(
     "productId"
   ).value;


 const payload = {

   action:"saveProduct",

   User_ID:
     user.User_ID,

   Product_ID:
     productId,

   Name:
     document.getElementById(
       "productName"
     ).value,

   Category:
     document.getElementById(
       "productCategory"
     ).value,

   Code:
     document.getElementById(
       "productCode"
     ).value,

   Price:
     document.getElementById(
       "productPrice"
     ).value,

   Description:
     document.getElementById(
       "productDescription"
     ).value,

   Status:"active"

 };


 const result =
   await postData(payload);


 if(!result.ok){

   alert(
     result.error ||
     "Product save failed"
   );

   return;

 }


 const finalProductId =
   result.Product_ID;


 const imageInput =
   document.getElementById(
     "productImage"
   );


 if(
   imageInput.files &&
   imageInput.files.length
 ){

   document.getElementById(
     "imageStatus"
   ).textContent =
     "Photo processing...";


   try{

     const base64 =
       await compressImage(
         imageInput.files[0]
       );


     document.getElementById(
       "imageStatus"
     ).textContent =
       "Photo uploading...";


     const imageResult =
       await postData({

         action:
           "saveProductImage",

         User_ID:
           user.User_ID,

         Product_ID:
           finalProductId,

         base64:
           base64

       });


     if(!imageResult.ok){

       alert(
         imageResult.error ||
         "Image upload failed"
       );

       return;

     }


     document.getElementById(
       "imageStatus"
     ).textContent =
       "Photo saved successfully.";

   }catch(error){

     console.error(error);

     alert(
       "Photo upload failed."
     );

     return;

   }

 }


 closeProduct();

 await loadDashboard();

 showNotice(
   "Product saved successfully."
 );

}



async function compressImage(file){

 const MAX_BYTES =
   100 * 1024;


 const image =
   await loadImage(file);


 const size =
   Math.min(
     image.width,
     image.height
   );


 const canvas =
   document.createElement(
     "canvas"
   );


 let targetSize =
   900;


 canvas.width =
   targetSize;

 canvas.height =
   targetSize;


 const ctx =
   canvas.getContext("2d");


 const sx =
   (image.width - size) / 2;


 const sy =
   (image.height - size) / 2;


 ctx.drawImage(
   image,
   sx,
   sy,
   size,
   size,
   0,
   0,
   targetSize,
   targetSize
 );


 let quality =
   0.85;


 let blob =
   await canvasToBlob(
     canvas,
     quality
   );


 while(
   blob.size > MAX_BYTES &&
   quality > 0.10
 ){

   quality -= 0.05;

   blob =
     await canvasToBlob(
       canvas,
       quality
     );

 }


 if(blob.size > MAX_BYTES){

   canvas.width =
     700;

   canvas.height =
     700;


   ctx.clearRect(
     0,
     0,
     700,
     700
   );


   ctx.drawImage(
     image,
     sx,
     sy,
     size,
     size,
     0,
     0,
     700,
     700
   );


   quality =
     0.75;


   blob =
     await canvasToBlob(
       canvas,
       quality
     );


   while(
     blob.size > MAX_BYTES &&
     quality > 0.10
   ){

     quality -= 0.05;

     blob =
       await canvasToBlob(
         canvas,
         quality
       );

   }

 }


 const buffer =
   await blob.arrayBuffer();


 const bytes =
   new Uint8Array(buffer);


 let binary =
   "";


 const chunk =
   0x8000;


 for(
   let i=0;
   i<bytes.length;
   i+=chunk
 ){

   binary +=
     String.fromCharCode(
       ...bytes.subarray(
         i,
         i+chunk
       )
     );

 }


 return btoa(binary);

}



function loadImage(file){

 return new Promise(
   (resolve,reject)=>{

     const url =
       URL.createObjectURL(file);


     const image =
       new Image();


     image.onload = () => {

       URL.revokeObjectURL(url);

       resolve(image);

     };


     image.onerror =
       reject;


     image.src =
       url;

   }
 );

}



function canvasToBlob(
 canvas,
 quality
){

 return new Promise(
   resolve => {

     canvas.toBlob(
       blob =>
         resolve(blob),
       "image/jpeg",
       quality
     );

   }
 );

}



async function deleteProduct(id){

 if(!confirm(
   "Is product ko delete karna hai?"
 ))return;


 const result =
   await postData({

     action:
       "deleteProduct",

     User_ID:
       dashboardData.user.User_ID,

     Product_ID:
       id

   });


 if(!result.ok){

   alert(
     result.error ||
     "Delete failed"
   );

   return;

 }


 await loadDashboard();

 showNotice(
   "Product deleted."
 );

}



async function postData(payload){

 const response =
   await fetch(
     API_URL,
     {
       method:"POST",

       headers:{
         "Content-Type":
           "text/plain;charset=utf-8"
       },

       body:
         JSON.stringify(payload)
     }
   );


 return await response.json();

}

function showNotice(message){

 const notice =
   document.getElementById(
     "notice"
   );


 notice.textContent =

 notice.style.display =

 setTimeout(
   ()=>{

 );

}
